    <meta charset="UTF-8" />
    <meta

    <title>Showroom Manager — GST Billing</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        font-family: system-ui, sans-serif;
        color: #312e81;
        z-index: 9999;
      }
      #boot .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #4338ca, #312e81);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        box-shadow: 0 10px 30px rgba(49, 46, 129, 0.35);
      }
