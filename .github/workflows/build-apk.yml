name: Build Android APK

on:
  push:
    branches: [ main, master, arena/01a0fba1-showroom-manager1 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --warning-mode=summary 2>&1 | tee build.log

      - name: Build log summary (agar fail ho)
        if: failure()
        run: |
          {
            echo "## ❌ APK build fail hua"
            echo ""
            echo '```'
            tail -c 12000 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Showroom-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build log (fail hone par)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Publish APK — public download link (release)
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK file: $APK"
          cp "$APK" Showroom.apk
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          NOTES="Direct install: APK download karke phone me install karein (unknown sources allow karein). MyBillBook jaisa GST billing app: Tax Invoice, Estimate, Proforma, Delivery Challan, Bill of Supply, Credit Note, Purchase Bill, udhaar khata, Payments In/Out, Expenses, aging + day book reports, UPI QR, barcode billing, print (A4 + thermal 80mm), WhatsApp share. Pura app APK ke andar bundled hai - internet ke bina bhi chalta hai, data phone me hi rehta hai. Build #${{ github.run_number }}"
          gh release create apk-latest "$APK" Showroom.apk \
            --title "Showroom APK (latest build)" \
            --notes "$NOTES"
