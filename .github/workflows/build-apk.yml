name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Release / Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Detect Directory and Build APK
        run: |
          PROJECT_DIR="."
          if [ -d "showroom-manager/app" ]; then
            PROJECT_DIR="showroom-manager"
          fi
          cd "$PROJECT_DIR"
          echo "Building inside directory: $PWD"
          
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Showroom-Manager-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
