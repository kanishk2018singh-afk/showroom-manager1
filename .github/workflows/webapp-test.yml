name: Web App Smoke Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Data layer + UI smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Run smoke test
        run: npm run smoke

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: webapp/smoke/.build/run.mjs
          if-no-files-found: ignore
          retention-days: 7
